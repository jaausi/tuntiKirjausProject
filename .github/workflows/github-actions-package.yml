name: Build Test and Package

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  Build-Test-And-Package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup java with maven cached
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          # Credentials for tuntikirjaus-components-lib in GitHub Packages
          server-id: github-tuntikirjaus
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build and run tests
        run: mvn -B clean test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package JavaFx application with jlink
        if: github.event_name != 'pull_request'
        run: mvn -B javafx:jlink
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create staging folder
        if: github.event_name != 'pull_request'
        run: mkdir staging && cp target/*.zip staging

      - name: Release artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Tuntikirjaus-package-with-jre
          path: staging

  Package-macOS-dmg:
    if: github.event_name != 'pull_request'
    needs: Build-Test-And-Package
    # Apple Silicon runner: jlink bundles the JRE and JavaFX natives of the build machine
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup java with maven cached
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          server-id: github-tuntikirjaus
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build runtime image with jlink and create dmg with jpackage
        run: |
          mvn -B clean javafx:jlink
          ./buildResources/build-mac-dmg.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tuntikirjaus-macOS-dmg
          path: target/dist/*.dmg

  Package-Linux-deb:
    if: github.event_name != 'pull_request'
    needs: Build-Test-And-Package
    # x86_64 runner: jlink bundles the JRE and JavaFX natives of the build machine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup java with maven cached
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          server-id: github-tuntikirjaus
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Install deb packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Build runtime image with jlink and create deb with jpackage
        run: |
          mvn -B clean javafx:jlink
          ./buildResources/build-linux-deb.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tuntikirjaus-Linux-deb
          path: target/dist/*.deb

  Package-Windows-msi:
    if: github.event_name != 'pull_request'
    needs: Build-Test-And-Package
    # windows-2022 image ships WiX Toolset 3, which jpackage needs to create the msi
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup java with maven cached
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          server-id: github-tuntikirjaus
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build runtime image with jlink and create msi with jpackage
        run: |
          mvn -B clean javafx:jlink
          ./buildResources/build-windows-msi.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload msi artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tuntikirjaus-Windows-msi
          path: target/dist/*.msi

  Release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [Build-Test-And-Package, Package-macOS-dmg, Package-Linux-deb, Package-Windows-msi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            # Tags with a suffix (e.g. v1.1.7-BETA) are marked as prereleases
            PRERELEASE=""
            if [[ "$TAG" == *-* ]]; then PRERELEASE="--prerelease"; fi
            gh release create "$TAG" --verify-tag --generate-notes $PRERELEASE
          fi
          gh release upload "$TAG" artifacts/*.dmg artifacts/*.deb artifacts/*.msi --clobber
