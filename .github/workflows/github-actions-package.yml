name: Build Test and Package

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  Build-Test-And-Package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup java with maven cached
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          # Credentials for tuntikirjaus-components-lib in GitHub Packages
          server-id: github-tuntikirjaus
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build and run tests
        run: mvn -B clean test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package JavaFx application with jlink
        if: github.event_name != 'pull_request'
        run: mvn -B javafx:jlink
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create staging folder
        if: github.event_name != 'pull_request'
        run: mkdir staging && cp target/*.zip staging

      - name: Release artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Tuntikirjaus-package-with-jre
          path: staging
